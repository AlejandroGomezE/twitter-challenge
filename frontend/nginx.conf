# Static SPA server for the built Vite app (replaces /etc/nginx/conf.d/default.conf).
# No API proxy: the browser calls the API directly via the baked VITE_API_URL.

server_tokens off;

gzip on;
gzip_comp_level 5;
gzip_min_length 256;
gzip_vary on;
gzip_proxied any;
# text/html is always compressed when gzip is on; listing it would warn.
gzip_types
  text/css
  text/plain
  text/javascript
  application/javascript
  application/json
  application/manifest+json
  image/svg+xml;

server {
  # IPv4 only: an IPv6 listen makes nginx fail to start on hosts with IPv6
  # disabled, and Docker's port publishing reaches the container over IPv4.
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Vite's content-hashed build output: safe to cache forever.
  # Missing files 404 instead of falling back to index.html; no `always`, so the
  # long-cache header is only sent on success (a 404 must not be cached for a year).
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # The app shell must always be revalidated so new deploys are picked up.
  # SPA fallbacks below are internally redirected here, so they get this header too.
  location = /index.html {
    add_header Cache-Control "no-cache" always;
  }

  # SPA fallback: client-side routes (e.g. /u/ada, /explore) serve index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
